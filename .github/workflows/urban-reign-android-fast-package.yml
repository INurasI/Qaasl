name: Urban Reign Android fast APK package

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/urban-reign-android-fast-package.yml"
      - "urban-reign-android/android-app/app/src/main/java/kz/nurasql77/urbanreign/LauncherActivity.java"
      - "urban-reign-android/android-app/app/src/main/AndroidManifest.xml"
  workflow_dispatch:
    inputs:
      native_run_id:
        description: "Successful run ID containing the ARM64 native APK artifact"
        required: false
        default: "39446603161"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  repackage-arm64-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout latest Android launcher and manifest
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.11.1-bin.zip --output "${RUNNER_TEMP}/gradle.zip"
          unzip -q "${RUNNER_TEMP}/gradle.zip" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packaging tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Download the existing native APK artifact (no native rebuild)
        uses: actions/download-artifact@v4
        with:
          name: Urban-Reign-Android-arm64-debug
          run-id: ${{ inputs.native_run_id || '39446603161' }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-apk-artifact

      - name: Extract and verify the existing ARM64 native library
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="${RUNNER_TEMP}/native-apk-artifact/UrbanReign-Android-arm64-debug.apk"
          test -s "$SOURCE_APK"
          DEST="urban-reign-android/android-app/app/src/main/jniLibs/arm64-v8a/liburban.so"
          install -D -m 0644 /dev/null "$DEST"
          unzip -p "$SOURCE_APK" lib/arm64-v8a/liburban.so > "$DEST"
          test -s "$DEST"
          file "$DEST"
          ls -lh "$DEST"
          if ! unzip -l "$SOURCE_APK" | grep -F 'lib/arm64-v8a/liburban.so' >/dev/null; then
            echo "The selected artifact does not contain the ARM64 native library." >&2
            exit 1
          fi

      - name: Build APK with current launcher and diagnostic button
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug -p urban-reign-android/android-app
          APK="urban-reign-android/android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          # Verify that the compiled launcher really contains the diagnostic button text.
          if ! strings "$APK" | grep -F "Show diagnostic log" >/dev/null; then
            echo "Diagnostic button text was not found in the packaged APK." >&2
            unzip -p "$APK" classes.dex | strings | grep -F "diagnostic" || true
          fi
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/liburban.so|AndroidManifest.xml'
          mkdir -p build/apk
          cp "$APK" build/apk/Urban-Reign-Android-arm64-debug.apk

      - name: Upload repackaged APK
        uses: actions/upload-artifact@v4
        with:
          name: Urban-Reign-Android-arm64-debug
          path: build/apk/Urban-Reign-Android-arm64-debug.apk
          if-no-files-found: error
          retention-days: 14
